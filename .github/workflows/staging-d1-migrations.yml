
name: Staging D1 migrations and Worker deploy

on:
  push:
    branches:
      - addis-egata-worker-staging
    paths:
      - ".github/workflows/staging-d1-migrations.yml"
      - "cloudflare/worker/**"

permissions:
  contents: read

concurrency:
  group: addis-egata-staging-migrate-deploy
  cancel-in-progress: false

jobs:
  migrate-and-deploy:
    if: github.ref == 'refs/heads/addis-egata-worker-staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: addis-egata-worker-staging

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      
      - name: Install Worker dependencies
        run: npm install


      - name: Verify staging-only database binding
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const c = fs.readFileSync("wrangler.jsonc", "utf8");
            if (
              !c.includes("addis-egata-bot-api-staging") ||
              !c.includes("addis-egata-db-staging") ||
              !c.includes("a2e813d7-e1c1-491d-ab5c-f8a78d7d3a4f") ||
              c.includes("aeb019c8-40b8-403c-ad89-912dd892f388")
            ) {
              console.error("Staging safety check failed. Stopping.");
              process.exit(1);
            }
          '

      - name: List staging migrations before applying
        run: npx wrangler d1 migrations list DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply migrations to staging D1 only
        run: npx wrangler d1 migrations apply DB --remote --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify staging migrations
        run: npx wrangler d1 migrations list DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy staging Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
