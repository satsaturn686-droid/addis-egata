
name: Staging D1 migration inspection

on:
  push:
    branches:
      - addis-egata-worker-staging

permissions:
  contents: read

concurrency:
  group: addis-egata-staging-d1-inspection
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/addis-egata-worker-staging'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: addis-egata-worker-staging

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Verify staging database
        run: |
          node -e "const fs=require('fs'); const s=fs.readFileSync('wrangler.jsonc','utf8'); if(!s.includes('a2e813d7-e1c1-491d-ab5c-f8a78d7d3a4f') || !s.includes('addis-egata-db-staging')) process.exit(1)"

      - name: List staging migrations only
        run: npx wrangler d1 migrations list DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
