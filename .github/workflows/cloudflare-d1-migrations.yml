
name: Apply Cloudflare D1 migrations

on:
  push:
    branches:
      - cloudflare-bot-staging
    paths:
      - ".github/workflows/cloudflare-d1-migrations.yml"
      - "cloudflare/worker/migrations/**"
      - "cloudflare/worker/wrangler.jsonc"
      - "cloudflare/worker/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: addis-egata-d1-migrations-staging
  cancel-in-progress: false

jobs:
  migrate:
    if: github.ref == 'refs/heads/cloudflare-bot-staging'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cloudflare/worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: List pending migrations
        run: npx wrangler d1 migrations list addis-egata-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply addis-egata-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
