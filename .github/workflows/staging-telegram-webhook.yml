
name: Staging Telegram Webhook

on:
  push:
    branches:
      - addis-egata-worker-staging
    paths:
      - .github/workflows/staging-telegram-webhook.yml

permissions:
  contents: read

jobs:
  register-staging-webhook:
    if: github.ref == 'refs/heads/addis-egata-worker-staging'
    runs-on: ubuntu-latest
    steps:
      - name: Register and verify staging webhook
        env:
          BOT_TOKEN: ${{ secrets.STAGING_TELEGRAM_BOT_TOKEN }}
          WEBHOOK_SECRET: ${{ secrets.STAGING_TELEGRAM_WEBHOOK_SECRET }}
          WEBHOOK_URL: https://addis-egata-bot-api-staging.satsaturn686.workers.dev/telegram/webhook
        run: |
          node <<'NODE'
          const token = process.env.BOT_TOKEN;
          const secret = process.env.WEBHOOK_SECRET;
          const webhook = process.env.WEBHOOK_URL;

          if (!token || !secret) {
            console.error('Required staging Telegram secrets are missing.');
            process.exit(1);
          }
          if (!/^[A-Za-z0-9_-]{1,256}$/.test(secret)) {
            console.error('Webhook secret format is invalid.');
            process.exit(1);
          }

          async function telegram(method, body) {
            const response = await fetch(`https://api.telegram.org/bot${token}/${method}`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(body)
            });
            const data = await response.json();
            if (!response.ok || !data.ok) {
              throw new Error(`Telegram ${method} failed: ${data.description || response.status}`);
            }
            return data.result;
          }

          (async () => {
            await telegram('setWebhook', {
              url: webhook,
              secret_token: secret,
              allowed_updates: ['message', 'callback_query'],
              drop_pending_updates: false
            });
            const info = await telegram('getWebhookInfo', {});
            if (info.url !== webhook) {
              throw new Error('Webhook verification failed: URL does not match staging.');
            }
            console.log('Staging webhook registered and verified.');
            console.log('Webhook URL:', info.url);
            console.log('Pending updates:', info.pending_update_count);
            if (info.last_error_message) {
              console.log('Telegram last error:', info.last_error_message);
            }
          })().catch(error => {
            console.error(error.message);
            process.exit(1);
          });
          NODE

# Retry after updating staging webhook secrets.
