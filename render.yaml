services:
  - type: web
    name: addis-egata-api
    runtime: node
    region: oregon
    plan: free

    buildCommand: npm --prefix apps/api install --include=dev && npm run build:api
    startCommand: npm --prefix apps/api run migrate:build && npm start

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: "10000"

      - key: DATABASE_URL
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: TELEGRAM_MAX_AUTH_AGE_SECONDS
        value: "86400"

      - key: ADMIN_TELEGRAM_IDS
        sync: false

      - key: MINI_APP_URL
        value: https://addis-egata-web.onrender.com

  - type: cron
    name: addis-egata-scheduled-draws
    runtime: node
    region: oregon
    plan: free

    schedule: "*/1 * * * *"

    buildCommand: npm --prefix apps/api install --include=dev && npm run build:api
    startCommand: npm --prefix apps/api run cron:scheduled-draws

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        sync: false

      - key: TELEGRAM_BOT_TOKEN
        sync: false

      - key: MINI_APP_URL
        value: https://addis-egata-web.onrender.com

  - type: web
    name: addis-egata-web
    runtime: static

    buildCommand: npm --prefix apps/web install && npm run build:web
    staticPublishPath: apps/web/dist

    envVars:
      - key: VITE_API_URL
        value: https://addis-egata-api.onrender.com
